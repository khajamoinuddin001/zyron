version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: zyron_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zyron_user
      POSTGRES_PASSWORD: zyron_pass
      POSTGRES_DB: zyron_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyron_user -d zyron_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin web UI to browse the database
  pgadmin:
    image: dpage/pgadmin4
    container_name: zyron_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@zyron.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
