version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: edminz_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: edminz_user
      POSTGRES_PASSWORD: edminz_pass
      POSTGRES_DB: edminz_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edminz_user -d edminz_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin web UI to browse the database
  pgadmin:
    image: dpage/pgadmin4
    container_name: edminz_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@edminz.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edminz_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://edminz_user:edminz_pass@postgres:5432/edminz_db
      - JWT_SECRET=edminz_super_secret_jwt_key_change_in_production_2024
      - JWT_EXPIRES_IN=7d
      - NEXTAUTH_URL=http://localhost:3001
      - FRONTEND_URL=http://localhost
    depends_on:
      - postgres

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edminz_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend

volumes:
  postgres_data:
    external: true
    name: zyron2_db_data
